[package]
name = "playlist-bridge"
version = "0.1.0"
description = "Transfère et synchronise des playlists entre TIDAL et Spotify, sans doublons."
authors = ["Elouan Bruzek"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "playlist_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
keyring = "3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
url = "2"
